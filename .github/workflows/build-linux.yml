name: Build Linux binary

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege (wave-3 review, S-2): builds (including pull
# requests) only READ the repo; the write token exists solely in the
# tag-gated publish job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install system dependencies (WebKitGTK for wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            gsettings-desktop-schemas \
            dconf-service \
            dbus

      # The ProxyOnly connect path drives the GNOME system proxy through
      # gsettings, which needs the desktop schemas and a session bus —
      # run the suite inside a throwaway D-Bus session, like a desktop.
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: dbus-run-session -- cargo test

      - name: Build release
        run: cargo build --release --bin ifoxy_app

      - name: Collect artifacts
        run: |
          mkdir -p dist/pkg
          cp target/release/ifoxy_app dist/pkg/
          cp install-linux.sh dist/pkg/
          tar -czf dist/ifoxy-linux-x86_64.tar.gz -C dist/pkg ifoxy_app install-linux.sh
          (cd dist && sha256sum ifoxy-linux-x86_64.tar.gz | awk '{print $1}' > ifoxy-linux-x86_64.tar.gz.sha256)

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ifoxy-linux-x86_64
          path: dist/ifoxy-linux-x86_64.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ifoxy-linux-x86_64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/ifoxy-linux-x86_64.tar.gz
            dist/ifoxy-linux-x86_64.tar.gz.sha256
