name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        shell: pwsh
        run: cargo build --release --bin ifoxy_app

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path target -Recurse -Filter ifoxy_app.exe |
            Where-Object { $_.FullName -match '\\release\\' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "ifoxy_app.exe not found" }
          Copy-Item $exe.FullName dist\ifoxy_app.exe
          (Get-FileHash dist\ifoxy_app.exe -Algorithm SHA256).Hash | Out-File dist\ifoxy_app.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifoxy_app-windows-x64
          path: dist/*

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
