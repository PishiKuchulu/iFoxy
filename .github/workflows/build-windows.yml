name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Least privilege (wave-3 review, S-2): builds (including pull
# requests) only READ the repo; the write token exists solely in the
# tag-gated publish job below.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Run the test suite on Windows too (wave-3 review, C-5): the
      # WFP/DPAPI/registry code is cfg(windows) and previously never
      # executed in CI at all. The admin-only WFP tests stay #[ignore]d.
      - name: Run tests
        run: cargo test

      - name: Build release
        shell: pwsh
        run: cargo build --release --bin ifoxy_app

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path target -Recurse -Filter ifoxy_app.exe |
            Where-Object { $_.FullName -match '\\release\\' } |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "ifoxy_app.exe not found" }
          Copy-Item $exe.FullName dist\ifoxy_app.exe
          (Get-FileHash dist\ifoxy_app.exe -Algorithm SHA256).Hash | Out-File dist\ifoxy_app.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ifoxy_app-windows-x64
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ifoxy_app-windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
