name: Android Release

# Tag a version (vX.Y.Z) to test and publish the Android release.
# Kept separate from Android CI: `paths` filters are unreliable on tag
# pushes and must never be able to skip a release.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Decode signing keystore
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore decoded; the release APK will be signed."
          else
            # Fail fast with the real cause: continuing would build an
            # unsigned APK and the failure would only surface later as
            # a confusing "cannot stat app-release.apk" at the rename
            # step (external review, A8). A tagged release must never
            # ship unsigned.
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is not configured; refusing to build an unsigned release APK."
            exit 1
          fi

      - name: Assemble release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload R8 mapping
        # Kept so on-device crash traces from this exact build can be
        # deobfuscated later — without it, a shipped build's obfuscated
        # frames are unreadable (learned from the 1.0.29 disconnect
        # crash, whose mapping was discarded with the runner).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Remove the decoded keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Name the APK for the release
        # Gradle's default output is app-release.apk (module + variant);
        # publish it under the product name instead.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/iFoxy-v${version}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
